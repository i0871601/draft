<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home</title>
        <link rel="stylesheet" href="./journal-style.css">
        <!--<link rel="stylesheet" href="./info-style.css">
        <link rel="stylesheet" href="./add-style.css">!-->
    </head>

    <body>
        <input type="checkbox" id="on-Subject" class="input" checked>
        <input type="checkbox" id="on-Class" class="input" checked>
        

        <main id="Journal">
            <input type="radio" name="trigger" id="trigger" class="input">
            <input type="radio" name="trigger" id="time" class="input">
            <input type="radio" name="trigger" id="select-folder" class="input">
            <input type="checkbox" id="off-on-journal" class="input">

            <div id="main-bar">
                <label for="time" id="time-button" class="marks">
                    <span id="hour"></span>
                    <span id="minut"></span>
                </label>

                <label for="select-folder" id="select-button" class="marks"></label>
            </div>

            <div id="content-time" class="content">
                <div id="calendar">
                    <h3 id="month"></h3>
                    </div>
                    <div id="week"></div>
                    <div id="content-calendar"></div>
                </div>
            </div>
            <!--<div id="content-select" class="content"></div>
            <div id="table" class="content"></div>!-->
        </main>


        <script src="./script-calendar.js" type="module"></script>
        <!--<script src="./script-list.js" type="module"></script>
        <script src="./script-journal.js" type="module"></script>!-->


    </body>
</html>
