<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home</title>
        <link rel="stylesheet" href="./css/bar-style.css">
        <link rel="stylesheet" href="./css/journal-style.css">
        <!--<link rel="stylesheet" href="./info-style.css">
        <link rel="stylesheet" href="./add-style.css">!-->
    </head>

    <body>
        <main id="Journal">
            <input type="radio" name="trigger" id="trigger" class="input">
            <input type="radio" name="trigger" id="time" class="input" checked>
            <input type="radio" name="trigger" id="journal" class="input">

            <!--<input type="checkbox" id="checkbox-event-day" class="input">!-->

            <div id="main-bar">
                <label for="time" id="time-button" class="marks">
                    <span id="hour"></span>
                    <span id="minut"></span>
                </label>

                <label for="journal" id="main-button" class="marks">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </label>
            </div>

            <div id="content">
                <div id="content-time" class="content"></div>
                
                <div id="content-journal" class="content">
                    <input type="checkbox" id="select-subject" class="input">
                    <input type="checkbox" id="on-off-journal" class="input">

                    <input type="radio" name="content" id="radio-journal-frame" class="input" checked>
                    <input type="radio" name="content" id="radio-lesson-frame" class="input">

                    <div id="select-navg">
                        <div id="journal-or-lesson">
                            <label for="radio-journal-frame" id="first-navg">Журнал</label>
                            <label for="radio-lesson-frame" id="last-navg">Уроки</label>
                            <span></span>
                        </div>

                        <label for="select-subject" id="button-select-subject">
                            <p id="text-select">Предмет/Клас</p>
                            <div id="arrow">
                                <span></span>
                                <span></span>
                            </div>
                            <div id="content-list-subject">
                                <div id="wrapper-list">
                                    <ul id="list-subject"></ul>
                                </div>
                            </div>
                        </label>
                    </div>

                    <div id="journal-frame">
                        <p id="text-error-frame">Не вибраний журнал</p>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026, Сікан І.В.</p>
        </footer>

        <script src="./script/config.js"></script>
        <script src="./script/script-calendar.js"></script>
        <script src="./script/script-schedule.js"></script>
        <script src="./script/script-select.js"></script>
        <script src="./script/script-lesson.js"></script>
        <script src="./script/script-main.js"></script>
    </body>
</html>
