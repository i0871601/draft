<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home</title>
        <link rel="stylesheet" href="./css/bar-style.css">
        <link rel="stylesheet" href="./css/journal-style.css">
        <!--<link rel="stylesheet" href="./info-style.css">
        <link rel="stylesheet" href="./add-style.css">!-->
    </head>

    <body>
        <input type="checkbox" id="on-Subject" class="input" checked>
        <input type="checkbox" id="on-Class" class="input" checked>
        

        <main id="Journal">
            <input type="radio" name="trigger" id="trigger" class="input">
            <input type="radio" name="trigger" id="time" class="input" checked>
            <input type="radio" name="trigger" id="select-folder" class="input">

            <input type="checkbox" id="checkbox-event-day" class="input">

            <div id="main-bar">
                <label for="time" id="time-button" class="marks">
                    <span id="hour"></span>
                    <span id="minut"></span>
                </label>

                <label for="select-folder" id="select-button" class="marks">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </label>

                <label for="checkbox-event-day" id="off-event-day-button"></label>
            </div>

            <div id="content">
                <div id="content-time" class="content"></div>
                
                <div id="content-select" class="content"></div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026, Сікан І.В.</p>
        </footer>

        <script src="./script/config.js"></script>
        <script src="./script/script-list-lesson.js"></script>
        <script src="./script/script-calendar.js"></script>
        <script src="./script/script-main.js"></script>
    </body>
</html>
