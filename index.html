<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <form id="auth-form">
    <input type="checkbox" id="error-toggle" class="input">

    <input type="text" id="access-code" name="access-code" placeholder="введіть код доступу" autocomplete="off" inputmode="latin" lang="en" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="10" autofocus required>
    
    <input type="checkbox" id="on-loading" class="input">
    <label for="on-loading" id="button">
      <div id="on" class="button">
        <span></span>
      </div>
      <div id="loading" class="button"></div>
    </label>

    <p id="error-msg" class="error-text">невірний формат коду</p>
  </form>

  <script src="./script.js"></script>
</body>
</html>
