<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <form id="auth-form">
    <input type="checkbox" id="error-toggle" class="input">


    <p id="h1">base</p>
    <input type="text" id="access-code" name="access-code" placeholder="Введіть код доступу" autocomplete="off" required>
    
    <input type="checkbox" id="on-loading" class="input">
    <label for="on-loading" id="button">
      <div id="on" class="button"></div>
      <div id="loading" class="button"></div>
    </label>

    <p id="error-msg" class="error-text">невірний формат коду</p>
  </form>

  <script src="./script.js"></script>
</body>
</html>
