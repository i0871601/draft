<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./styles-content.css">
</head>
<body>
  <input type="checkbox" id="access-on-off" class="input">

  <div id="access">
    <form id="auth-form">
      <input type="checkbox" id="error-toggle" class="input">
      
      <input type="text" id="access-code" name="access-code" placeholder="введіть код доступу" autocomplete="off" inputmode="latin" lang="en" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="10" autofocus>
      
      <input type="checkbox" id="on-loading" class="input">
      <label for="on-loading" id="button">
        <div id="on" class="button">
          <span></span>
        </div>
        <div id="loading" class="button">
          <span></span>
        </div>
      </label>
      
      <p id="error-msg" class="error-text">невірний код доступу</p>
    </form>
  </div>


  <div id="contents">
    <input type="radio" name="menu" id="input-material" class="input">
    <input type="radio" name="menu" id="input-revision" class="input">

    <input type="checkbox" id="input-add-material" class="input">

    <div id="materials" class="content">
      <div class="title">
        <p>Матеріали:</p>
        <label for="input-add-material">
          <span></span>
        </label>
      </div>
    </div>

    <div id="revision" class="content">

    </div>

  </div>


  <script src="./script.js"></script>
</body>
</html>
